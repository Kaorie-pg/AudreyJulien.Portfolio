services:
  app:
    build: .
    image: audre-portfolio:latest
    env_file: .env
    environment:
      - NODE_ENV
      - PORT
      - APP_SECRET
      - APP_SECRET_FILE=/run/secrets/app_secret
    expose:
      - '3000'
    networks:
      - webnet
    secrets:
      - app_secret

  nginx:
    image: nginx:stable-alpine
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

secrets:
  app_secret:
    file: ./secrets/app_secret
